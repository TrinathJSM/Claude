name: Build FaceMorph APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout facemorphapp-v3
        uses: actions/checkout@v4
        with:
          ref: facemorphapp-v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_SDK"     >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK"          >  FaceMorphApp/local.properties
          SDKMANAGER=$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "Installed platforms:"; ls $ANDROID_SDK/platforms/
          echo "Installed build-tools:"; ls $ANDROID_SDK/build-tools/

      - name: Make gradlew executable
        working-directory: FaceMorphApp
        run: chmod +x gradlew

      - name: Generate placeholder assets (Python only - no heredocs)
        run: |
          python3 << 'PYEOF'
          import struct, zlib, os, json

          # ── PNG helper ────────────────────────────────────────────────────
          def make_png(w, h, r, g, b):
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', crc)
              sig  = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw  = (b'\x00' + bytes([r, g, b]) * w) * h
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend

          # ── Lottie animation ──────────────────────────────────────────────
          os.makedirs('FaceMorphApp/app/src/main/assets/animations', exist_ok=True)
          lottie = {"v":"5.9.0","fr":30,"ip":0,"op":90,"w":512,"h":512,"nm":"FaceMorph","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"Circle","sr":1,"ks":{"o":{"a":0,"k":100},"r":{"a":1,"k":[{"i":{"x":[0.833],"y":[0.833]},"o":{"x":[0.167],"y":[0.167]},"t":0,"s":[0]},{"t":90,"s":[360]}]},"p":{"a":0,"k":[256,256,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":0,"k":[100,100,100]}},"ao":0,"shapes":[{"ty":"el","d":1,"s":{"a":0,"k":[200,200]},"p":{"a":0,"k":[0,0]},"nm":"Ellipse"},{"ty":"fl","c":{"a":0,"k":[0.482,0.188,0.745,1]},"o":{"a":0,"k":100},"r":1,"bm":0,"nm":"Fill"}],"ip":0,"op":90,"st":0,"bm":0}]}
          with open('FaceMorphApp/app/src/main/assets/animations/morphing.json', 'w') as f:
              json.dump(lottie, f)

          # ── Target face images ────────────────────────────────────────────
          os.makedirs('FaceMorphApp/app/src/main/assets/targets', exist_ok=True)
          for name, rgb in [('celebrity_01.png',(200,150,120)),
                            ('celebrity_02.png',(180,140,110)),
                            ('celebrity_03.png',(220,160,130))]:
              with open(f'FaceMorphApp/app/src/main/assets/targets/{name}', 'wb') as f:
                  f.write(make_png(64, 64, *rgb))

          # ── Launcher icons ────────────────────────────────────────────────
          for density, size in [('mipmap-mdpi',48),('mipmap-hdpi',72),
                                ('mipmap-xhdpi',96),('mipmap-xxhdpi',144),
                                ('mipmap-xxxhdpi',192)]:
              d = f'FaceMorphApp/app/src/main/res/{density}'
              os.makedirs(d, exist_ok=True)
              png = make_png(size, size, 123, 47, 190)
              for icon in ('ic_launcher.png', 'ic_launcher_round.png'):
                  with open(f'{d}/{icon}', 'wb') as f:
                      f.write(png)

          print('All placeholder assets created successfully')
          PYEOF

      - name: Build debug APK
        working-directory: FaceMorphApp
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Show compilation errors on failure
        if: failure()
        run: |
          echo "====== KOTLIN / JAVA COMPILATION ERRORS ======"
          grep -n \
            -e "^e: " \
            -e "error:" \
            -e "Unresolved reference" \
            -e "None of the following candidates" \
            -e "Overload resolution ambiguity" \
            -e "Cannot access" \
            -e "Type mismatch" \
            -e "Expecting" \
            -e "No value passed" \
            -e "required:" \
            -e "FAILED" \
            /tmp/build.log | head -80 || true
          echo ""
          echo "====== LAST 60 LINES OF BUILD LOG ======"
          tail -60 /tmp/build.log || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FaceMorph-debug-${{ github.run_number }}
          path: FaceMorphApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build release APK (unsigned)
        if: success()
        working-directory: FaceMorphApp
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Upload release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FaceMorph-release-unsigned-${{ github.run_number }}
          path: FaceMorphApp/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
