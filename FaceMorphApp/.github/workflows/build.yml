name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:   # allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: FaceMorphApp
        run: chmod +x gradlew

      # ── Placeholder assets required for a successful build ─────────────────
      # Real apps would commit these files; we generate minimal stubs here so
      # the build can complete without binary assets in the repo.

      - name: Create placeholder Lottie animation
        run: |
          mkdir -p FaceMorphApp/app/src/main/assets/animations
          cat > FaceMorphApp/app/src/main/assets/animations/morphing.json << 'EOF'
          {"v":"5.9.0","fr":30,"ip":0,"op":90,"w":512,"h":512,"nm":"FaceMorph","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"Circle","sr":1,"ks":{"o":{"a":1,"k":[{"i":{"x":[0.833],"y":[0.833]},"o":{"x":[0.167],"y":[0.167]},"t":0,"s":[100]},{"t":90,"s":[0]}]},"r":{"a":0,"k":0},"p":{"a":0,"k":[256,256,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":1,"k":[{"i":{"x":[0.833,0.833,0.833],"y":[0.833,0.833,0.833]},"o":{"x":[0.167,0.167,0.167],"y":[0.167,0.167,0.167]},"t":0,"s":[100,100,100]},{"t":90,"s":[150,150,100]}]}},"ao":0,"shapes":[{"ty":"el","d":1,"s":{"a":0,"k":[200,200]},"p":{"a":0,"k":[0,0]},"nm":"Ellipse Path","mn":"ADBE Vector Shape - Ellipse"},{"ty":"fl","c":{"a":0,"k":[0.482,0.188,0.745,1]},"o":{"a":0,"k":100},"r":1,"bm":0,"nm":"Fill"}],"ip":0,"op":90,"st":0,"bm":0}]}
          EOF

      - name: Create placeholder target face images
        run: |
          mkdir -p FaceMorphApp/app/src/main/assets/targets
          # Create 3 minimal 1×1 PNG files as placeholders
          python3 - << 'EOF'
          import struct, zlib, base64
          def make_1x1_png(r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0))
              raw = b'\x00' + bytes([r, g, b])
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          faces = [('celebrity_01.png',(200,150,120)),('celebrity_02.png',(180,140,110)),('celebrity_03.png',(220,160,130))]
          for name, (r,g,b) in faces:
              open(f'FaceMorphApp/app/src/main/assets/targets/{name}','wb').write(make_1x1_png(r,g,b))
          print('Placeholder PNGs created')
          EOF

      - name: Create launcher icon stubs
        run: |
          python3 - << 'EOF'
          import struct, zlib, os
          def make_png(size, r, g, b):
              def chunk(name, data):
                  c = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', c)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              row = b'\x00' + bytes([r, g, b]) * size
              idat = chunk(b'IDAT', zlib.compress(row * size))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          densities = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for d, size in densities.items():
              path = f'FaceMorphApp/app/src/main/res/{d}'
              os.makedirs(path, exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png'):
                  open(f'{path}/{name}','wb').write(make_png(size,123,47,190))
          print('Launcher icons created')
          EOF

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: FaceMorphApp
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      # ── Upload artifact (downloadable from the Actions tab) ────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceMorph-debug-apk
          path: FaceMorphApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Optional: build release APK (unsigned) ─────────────────────────────
      - name: Build release APK (unsigned)
        working-directory: FaceMorphApp
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: FaceMorph-release-unsigned-apk
          path: FaceMorphApp/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
